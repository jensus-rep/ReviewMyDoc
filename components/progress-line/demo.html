<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress Line Demo</title>
<!--
  Demo of the component progress-line: the indeterminate line at the edge of an
  area, the determinate line as an upload, and the variant fixed to the top of
  the window. The only script besides the simulated upload and page change is
  the mode switch, as in components/tokens/demo.html.
-->
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="progress-line.css">
<style>
  /* This page uses tokens only, no raw values, so it also checks them. */
  body {
    margin: 0;
    padding: var(--space-10) var(--space-5);
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: var(--font-size-text-web);
    font-weight: var(--font-weight-text);
    line-height: var(--line-height-text);
  }
  .wrap { max-width: 56em; margin-inline: auto; display: grid; gap: var(--space-7); }
  h1 {
    margin: 0;
    font-size: var(--font-size-page-title-web);
    font-weight: var(--font-weight-title);
    line-height: var(--line-height-title);
    letter-spacing: var(--letter-spacing-page-title-web);
  }
  p { margin: 0; max-width: var(--measure-text); }
  .head { display: flex; flex-wrap: wrap; gap: var(--space-5); align-items: end; justify-content: space-between; }
  .lead, .muted { color: var(--ink-2); }
  .panel {
    border: var(--hairline-width) solid var(--hairline);
    border-radius: var(--radius-m);
    overflow: hidden;
  }
  .panel > div { padding: var(--space-5); display: flex; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap; }
  .panel--2 { background: var(--bg-2); }
  .link {
    font: inherit;
    border: 0;
    background: none;
    color: var(--blue);
    padding: 0;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 0.15em;
  }
  .link:focus-visible { outline: calc(var(--hairline-width) * 2) solid var(--blue); outline-offset: var(--space-1); }

  /* The switch is part of the demo, not of the component, and stays quiet. */
  .switch { display: flex; gap: var(--space-1); }
  .switch button {
    font: inherit;
    font-size: var(--font-size-label-web);
    color: var(--ink-2);
    background: none;
    border: var(--hairline-width) solid var(--hairline);
    border-radius: var(--radius-button);
    padding: var(--space-1) var(--space-3);
    cursor: pointer;
  }
  .switch button[aria-pressed="true"] { color: var(--blue); border-color: var(--blue); }
  .switch button:focus-visible { outline: calc(var(--hairline-width) * 2) solid var(--blue); outline-offset: var(--space-1); }
</style>
</head>
<body>
<span class="progress-line progress-line--window" id="window-line" role="status" aria-label="Seite wird geladen" hidden></span>
<div class="wrap">

  <div class="head">
    <div>
      <h1>Progress Line</h1>
      <p class="lead">Eine Linie aus zwei Haarlinien am Rand eines Fensters oder Bereichs.</p>
    </div>
    <div class="switch" role="group" aria-label="Darstellung">
      <button type="button" data-set="system" aria-pressed="true">System</button>
      <button type="button" data-set="light" aria-pressed="false">Hell</button>
      <button type="button" data-set="dark" aria-pressed="false">Dunkel</button>
    </div>
  </div>

  <div class="panel">
    <span class="progress-line" role="status" aria-label="Wird geladen"></span>
    <div><span class="muted">Unbestimmt</span></div>
  </div>

  <div class="panel panel--2">
    <span class="progress-line" role="status" aria-label="Wird geladen"></span>
    <div><span class="muted">Unbestimmt, auf Sekundärgrund</span></div>
  </div>

  <div class="panel">
    <span class="progress-line progress-line--determinate" id="upload" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></span>
    <div><span class="muted" id="upload-text">Upload 0 %</span><button class="link" type="button" id="upload-btn">Upload starten</button></div>
  </div>

  <div><button class="link" type="button" id="window-btn">Seitenwechsel simulieren</button></div>

</div>
<script>
  // Demo only: simulated upload and page change.
  document.getElementById('upload-btn').onclick = function () {
    var line = document.getElementById('upload'), text = document.getElementById('upload-text'), v = 0;
    var t = setInterval(function () {
      v = Math.min(1, v + 0.07 + Math.random() * 0.08);
      line.style.setProperty('--progress-line-value', v);
      line.setAttribute('aria-valuenow', Math.round(v * 100));
      text.textContent = v < 1 ? 'Upload ' + Math.round(v * 100) + ' %' : 'Hochgeladen';
      if (v >= 1) clearInterval(t);
    }, 180);
  };
  document.getElementById('window-btn').onclick = function () {
    var line = document.getElementById('window-line');
    line.hidden = false;
    setTimeout(function () { line.hidden = true; }, 1500);
  };

  // Mode switch from components/tokens/demo.html. Without data-theme the system
  // decides, with it the page forces the mode.
  var root = document.documentElement;
  document.querySelectorAll('.switch button').forEach(function (button) {
    button.addEventListener('click', function () {
      var mode = button.dataset.set;
      if (mode === 'system') root.removeAttribute('data-theme');
      else root.setAttribute('data-theme', mode);
      document.querySelectorAll('.switch button').forEach(function (other) {
        other.setAttribute('aria-pressed', String(other === button));
      });
    });
  });
</script>
</body>
</html>
