<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading Dots Demo</title>
<!--
  Demo of the component loading-dots: three dots inline in a sentence, in text
  colour, in secondary text and in the accent colour. The only script is the
  mode switch, as in components/tokens/demo.html.
-->
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="loading-dots.css">
<style>
  /* This page uses tokens only, no raw values, so it also checks them. */
  body {
    margin: 0;
    padding: var(--space-10) var(--space-5);
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: var(--font-size-text-web);
    font-weight: var(--font-weight-text);
    line-height: var(--line-height-text);
  }
  .wrap { max-width: 56em; margin-inline: auto; display: grid; gap: var(--space-6); }
  h1 {
    margin: 0;
    font-size: var(--font-size-page-title-web);
    font-weight: var(--font-weight-title);
    line-height: var(--line-height-title);
    letter-spacing: var(--letter-spacing-page-title-web);
  }
  p { margin: 0; max-width: var(--measure-text); }
  .head { display: flex; flex-wrap: wrap; gap: var(--space-5); align-items: end; justify-content: space-between; }
  .lead, .muted { color: var(--ink-2); }
  .blue { color: var(--blue); }
  .ground--2 { background: var(--bg-2); padding: var(--space-6); border-radius: var(--radius-s); display: grid; gap: var(--space-4); }

  /* The switch is part of the demo, not of the component, and stays quiet. */
  .switch { display: flex; gap: var(--space-1); }
  .switch button {
    font: inherit;
    font-size: var(--font-size-label-web);
    color: var(--ink-2);
    background: none;
    border: var(--hairline-width) solid var(--hairline);
    border-radius: var(--radius-button);
    padding: var(--space-1) var(--space-3);
    cursor: pointer;
  }
  .switch button[aria-pressed="true"] { color: var(--blue); border-color: var(--blue); }
  .switch button:focus-visible { outline: calc(var(--hairline-width) * 2) solid var(--blue); outline-offset: var(--space-1); }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div>
      <h1>Loading Dots</h1>
      <p class="lead">Drei Punkte im Fließtext. Sie übernehmen die Textfarbe.</p>
    </div>
    <div class="switch" role="group" aria-label="Darstellung">
      <button type="button" data-set="system" aria-pressed="true">System</button>
      <button type="button" data-set="light" aria-pressed="false">Hell</button>
      <button type="button" data-set="dark" aria-pressed="false">Dunkel</button>
    </div>
  </div>

  <p class="muted">Wird gespeichert <span class="loading-dots" role="status" aria-label="Wird gespeichert"><i class="loading-dots__dot"></i><i class="loading-dots__dot"></i><i class="loading-dots__dot"></i></span></p>
  <p>Vorlage wird befüllt <span class="loading-dots" role="status" aria-label="Vorlage wird befüllt"><i class="loading-dots__dot"></i><i class="loading-dots__dot"></i><i class="loading-dots__dot"></i></span></p>
  <p class="blue">Wird gesendet <span class="loading-dots" role="status" aria-label="Wird gesendet"><i class="loading-dots__dot"></i><i class="loading-dots__dot"></i><i class="loading-dots__dot"></i></span></p>

  <div class="ground--2">
    <p class="muted">Auf Sekundärgrund: Wird gespeichert <span class="loading-dots" role="status" aria-label="Wird gespeichert"><i class="loading-dots__dot"></i><i class="loading-dots__dot"></i><i class="loading-dots__dot"></i></span></p>
  </div>

</div>

<script>
// Only script of this page: the mode switch from components/tokens/demo.html.
// Without data-theme the system decides, with it the page forces the mode.
const root = document.documentElement;
for (const button of document.querySelectorAll('.switch button')) {
  button.addEventListener('click', () => {
    const mode = button.dataset.set;
    if (mode === 'system') root.removeAttribute('data-theme');
    else root.setAttribute('data-theme', mode);
    for (const other of document.querySelectorAll('.switch button')) {
      other.setAttribute('aria-pressed', String(other === button));
    }
  });
}
</script>
</body>
</html>
