<!doctype html>

<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard · Baustein</title><link rel="stylesheet" href="../tokens/tokens.css"><link rel="stylesheet" href="dashboard.css"></head>
<body><main class="dashboard"><h1>Dashboard · Beispieldaten</h1><div class="dashboard__metrics">
